services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: etriod
      POSTGRES_PASSWORD: etriod_local_dev
      POSTGRES_DB: etriod
    ports:
      - "5432:5432"
    volumes:
      - etriod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etriod"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: sh -c "node scripts/migrate.js && node server/index.js"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgres://etriod:etriod_local_dev@db:5432/etriod
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-50000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID:-}
      STRIPE_DISPLAY_AMOUNT: ${STRIPE_DISPLAY_AMOUNT:-19}
      STRIPE_DISPLAY_CURRENCY: ${STRIPE_DISPLAY_CURRENCY:-USD}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      FLUTTERWAVE_WEBHOOK_SECRET_HASH: ${FLUTTERWAVE_WEBHOOK_SECRET_HASH:-}
      FLUTTERWAVE_TEAM_PLAN_ID: ${FLUTTERWAVE_TEAM_PLAN_ID:-}
      FLUTTERWAVE_TEAM_AMOUNT: ${FLUTTERWAVE_TEAM_AMOUNT:-}
      FLUTTERWAVE_CURRENCY: ${FLUTTERWAVE_CURRENCY:-NGN}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_TEAM_PLAN_CODE: ${PAYSTACK_TEAM_PLAN_CODE:-}
      PAYSTACK_TEAM_AMOUNT: ${PAYSTACK_TEAM_AMOUNT:-}
      PAYSTACK_CURRENCY: ${PAYSTACK_CURRENCY:-NGN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5500}
      APP_URL: ${APP_URL:-http://localhost:5500}
      CRON_SECRET: ${CRON_SECRET:-}
      PORT: 3000
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - etriod_model_data:/root/.ollama

volumes:
  etriod_pgdata:
  etriod_model_data:
