<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>Etriod — Company workspace</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--ink:#0b0b0b;--paper:#f6f6f3;--panel:#fff;--line:#deded9;--muted:#777771}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Manrope,Arial,sans-serif}.shell{max-width:1120px;margin:auto;padding:28px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:800;letter-spacing:-.05em}.top a{color:var(--muted);text-decoration:none}.intro{padding:32px 0 22px}.eyebrow{font:10px monospace;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}h1{font-size:32px;letter-spacing:-.06em;margin:8px 0}.intro p{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:19px}.stat small{color:var(--muted);text-transform:uppercase;font:10px monospace;letter-spacing:.08em}.value{font-size:29px;font-weight:700;letter-spacing:-.05em;margin-top:12px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.card h2{font-size:15px;margin:0 0 6px}.hint{font-size:12px;color:var(--muted);margin-bottom:17px}.form{display:flex;gap:8px}.form input,select{min-width:0;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:white}.form input{flex:1}button{cursor:pointer;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:600}button:disabled{opacity:.55;cursor:wait}.status{display:none;border-radius:8px;padding:10px;margin-top:12px;background:#eee}.status.show{display:block}.members{width:100%;border-collapse:collapse;margin-top:9px}th{text-align:left;color:var(--muted);font:10px monospace;text-transform:uppercase;padding:9px 5px;border-bottom:1px solid var(--line)}td{padding:12px 5px;border-bottom:1px solid #eee;font-size:12px}td select{padding:7px;font-size:12px}.person{font-weight:650}.muted{color:var(--muted)}.role{display:flex;gap:6px;align-items:center}.remove{padding:7px 9px;background:#eee;color:var(--ink);font-size:11px}.empty,.error{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:24px;margin-top:22px}.empty h2{margin-top:0}.empty p{color:var(--muted);line-height:1.6}.empty label{display:block;margin:14px 0 6px}.empty input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.error{color:#444}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.shell{padding:20px 15px}.top{gap:12px}.members{font-size:11px}.members th:nth-child(3),.members td:nth-child(3){display:none}}@media(max-width:430px){.form{flex-wrap:wrap}.form input{flex-basis:100%}}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">Etriod / Company</div><a href="app.html">Back to assistant →</a></header>
<section class="intro"><div class="eyebrow">Team workspace</div><h1 id="title">Your company</h1><p>Shared activity and access, with roles controlled by your company owner.</p></section>
<div id="content"><div class="card">Loading company workspace…</div></div>
</main>
<script src="config.js"></script><script>
const token=localStorage.getItem('etriod_token');
if(!token)location.href='login.html';
const headers={'Content-Type':'application/json',Authorization:'Bearer '+token};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const memberLimit=50;let memberOffset=0;
async function api(path,options={}){const response=await fetch(window.ETRIOD_API+path,{...options,headers:{...headers,...options.headers},body:options.body?JSON.stringify(options.body):undefined});const data=await response.json().catch(()=>({}));if(response.status===401){localStorage.removeItem('etriod_token');location.href='login.html';throw Error('Please sign in again.')}if(!response.ok)throw Error(data.error||'Request failed.');return data}
function showError(error){$('content').innerHTML='<div class="error">'+esc(error.message)+'<p class="muted">Company workspace data is private to its members.</p></div>'}
async function load(){try{const d=await api('/api/company/overview?limit='+memberLimit+'&offset='+memberOffset);render(d)}catch(e){if(e.message.includes('not a member'))renderNoCompany();else showError(e)}}
function renderNoCompany(){api('/api/auth/me').then(({user})=>{$('content').innerHTML=user.plan==='team'||user.plan==='enterprise'?'<section class="empty"><h2>Create a company workspace</h2><p>Your Team subscription includes a private workspace for your company. Add existing Etriod accounts and control member access.</p><label for="companyName">Company name</label><input id="companyName" maxlength="120" placeholder="Company name"><button id="createBtn" style="margin-top:12px">Create workspace</button><div class="status" id="status"></div></section>':'<section class="empty"><h2>Company workspaces are part of Team</h2><p>Upgrade your account to create and manage a company workspace.</p><a href="pricing.html">View plans →</a></section>';const b=$('createBtn');if(b)b.onclick=async()=>{b.disabled=true;try{await api('/api/company',{method:'POST',body:{name:$('companyName').value}});await load()}catch(e){$('status').textContent=e.message;$('status').classList.add('show');b.disabled=false}}}).catch(showError)}
function render(d){$('title').textContent=d.company.name;$('content').innerHTML='<section class="stats"><div class="stat"><small>Members</small><div class="value">'+esc(d.stats.members)+'</div></div><div class="stat"><small>Active · 7 days</small><div class="value">'+esc(d.stats.active_members_7d)+'</div></div><div class="stat"><small>Conversations</small><div class="value">'+esc(d.stats.conversations)+'</div></div><div class="stat"><small>Messages · 30 days</small><div class="value">'+esc(d.stats.messages_30d)+'</div></div></section><div class="grid"><section class="card"><h2>People & access</h2><div class="hint">You have the <b>'+esc(d.company.role)+'</b> role. Members must already have an Etriod account.</div><form id="addForm" class="form"><input id="email" type="email" required placeholder="teammate@company.com" aria-label="Teammate email"><button id="addBtn">Add member</button></form><div class="status" id="status" role="status"></div><div style="overflow:auto"><table class="members"><thead><tr><th>Person</th><th>Role</th><th>Conversations</th><th>Activity</th><th></th></tr></thead><tbody>'+d.members.map(m=>'<tr><td><div class="person">'+esc(m.name)+'</div><div class="muted">'+esc(m.email)+'</div></td><td>'+roleControl(m,d.company.role)+'</td><td>'+esc(m.conversation_count)+'</td><td>'+ (m.last_active_at?esc(new Date(m.last_active_at).toLocaleDateString()):'<span class="muted">—</span>')+'</td><td>'+(m.role!=='owner'&&(d.company.role==='owner'||m.role==='member')?'<button class="remove" data-remove="'+esc(m.id)+'">Remove</button>':'')+'</td></tr>').join('')+'</tbody></table></div></section><aside class="card"><h2>Company overview</h2><div class="hint">Usage totals include company members only.</div><p><b>'+esc(d.company.name)+'</b></p><p class="muted">Your company data is isolated from other workspaces. Owners cannot be removed or demoted from this screen.</p></aside></div>';const status=$('status');const pager=document.createElement('div');pager.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#777';pager.innerHTML='<span>Members '+(d.members.length?d.pagination.offset+1:0)+'–'+(d.pagination.offset+d.members.length)+' of '+esc(d.stats.members)+'</span><span><button type="button" class="remove" id="prevMembers" '+(d.pagination.offset===0?'disabled':'')+'>Previous</button> <button type="button" class="remove" id="nextMembers" '+(!d.pagination.hasMore?'disabled':'')+'>Next</button></span>';document.querySelector('.members').parentElement.insertAdjacentElement('afterend',pager);$('prevMembers').onclick=()=>{memberOffset=Math.max(0,memberOffset-memberLimit);load()};$('nextMembers').onclick=()=>{memberOffset+=memberLimit;load()};$('addForm').onsubmit=async e=>{e.preventDefault();const b=$('addBtn');b.disabled=true;try{await api('/api/company/members',{method:'POST',body:{email:$('email').value}});await load()}catch(err){status.textContent=err.message;status.classList.add('show');b.disabled=false}};document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{try{await api('/api/company/members/'+encodeURIComponent(s.dataset.role),{method:'PATCH',body:{role:s.value}});await load()}catch(e){status.textContent=e.message;status.classList.add('show');await load()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this member from the company workspace? Their account and conversations will remain.'))return;try{await api('/api/company/members/'+encodeURIComponent(b.dataset.remove),{method:'DELETE'});await load()}catch(e){status.textContent=e.message;status.classList.add('show')}})}
function roleControl(m,viewerRole){if(m.role==='owner')return '<b>Owner</b>';if(viewerRole==='owner')return '<select data-role="'+esc(m.id)+'"><option value="member" '+(m.role==='member'?'selected':'')+'>Member</option><option value="admin" '+(m.role==='admin'?'selected':'')+'>Admin</option></select>';return esc(m.role)}
load();
</script></body></html>
