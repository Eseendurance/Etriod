<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETriod — Reset password</title>
<style>
  :root{ --ink:#0a0a0a; --warm:#111111; --line:#e8e6e2; --muted:#6c6c68; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#fbfaf8; color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;}
  .brand{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; text-align:center; margin-bottom:22px;}
  .card{width:100%; max-width:380px; background:#fff; border:1.5px solid var(--line); border-radius:18px; padding:32px; margin:20px;}
  h1{font-family:'Space Grotesk',sans-serif; font-size:20px; text-align:center; margin-bottom:8px;}
  p.sub{text-align:center; font-size:13.5px; color:var(--muted); margin-bottom:22px;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;}
  input{width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:9px; font-size:14.5px; margin-bottom:14px;}
  input:focus{outline:none; border-color:var(--warm);}
  button{width:100%; padding:12px; background:var(--warm); color:#fff; border:none; border-radius:9px; font-weight:600; font-size:14.5px; cursor:pointer;}
  .msg{font-size:13px; padding:10px 12px; border-radius:9px; margin-bottom:14px; display:none;}
  .msg.ok{background:#f0f0ed; color:#111; display:block;}
  .msg.err{background:#f0f0ed; color:#111; display:block;}
  a{color:var(--muted); font-size:13px; display:block; text-align:center; margin-top:16px;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">ETriod</div>
  <div id="requestView">
    <h1>Reset your password</h1>
    <p class="sub">We'll email you a link to set a new one.</p>
    <div class="msg" id="requestMsg"></div>
    <label>Email</label>
    <input type="email" id="email" required>
    <button id="requestBtn">Send reset link</button>
  </div>
  <div id="resetView" style="display:none;">
    <h1>Choose a new password</h1>
    <p class="sub">Enter a new password for your account.</p>
    <div class="msg" id="resetMsg"></div>
    <label>New password</label>
    <input type="password" id="newPassword" minlength="8" required>
    <button id="resetBtn">Update password</button>
  </div>
  <a href="login.html">← Back to sign in</a>
</div>
<script src="config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if(token){
  document.getElementById('requestView').style.display = 'none';
  document.getElementById('resetView').style.display = 'block';
}

document.getElementById('requestBtn').onclick = async ()=>{
  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('requestMsg');
  msg.className = 'msg'; msg.style.display = 'none';
  try{
    const res = await fetch(window.ETRIOD_API + '/api/auth/request-password-reset', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email })
    });
    const data = await res.json();
    msg.textContent = data.message || (res.ok ? 'Check your email for a reset link.' : 'Something went wrong.');
    msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
  }catch(e){ msg.textContent = 'Network error — please try again.'; msg.className = 'msg err'; }
};

document.getElementById('resetBtn').onclick = async ()=>{
  const newPassword = document.getElementById('newPassword').value;
  const msg = document.getElementById('resetMsg');
  msg.className = 'msg'; msg.style.display = 'none';
  try{
    const res = await fetch(window.ETRIOD_API + '/api/auth/reset-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token, newPassword })
    });
    const data = await res.json();
    msg.textContent = data.message || data.error;
    msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
    if(res.ok) setTimeout(()=> window.location.href = 'login.html', 1500);
  }catch(e){ msg.textContent = 'Network error — please try again.'; msg.className = 'msg err'; }
};
</script>
</body>
</html>
