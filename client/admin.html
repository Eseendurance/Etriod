<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etriod — Operations</title><link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--ink:#0b0b0b;--paper:#f6f6f3;--panel:#fff;--line:#deded9;--muted:#777771}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Manrope,Arial,sans-serif}.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.nav{background:var(--ink);color:#fff;padding:23px 16px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:19px;letter-spacing:-.05em;padding:0 8px 30px}.brand span{display:inline-grid;place-items:center;background:#fff;color:#000;width:26px;height:26px;border-radius:8px;margin-right:8px}.nav-label{font:10px monospace;color:#888;padding:0 8px 8px;text-transform:uppercase;letter-spacing:.12em}.nav-item{color:#aaa;text-decoration:none;padding:10px 9px;border-radius:8px;margin:2px 0}.nav-item:hover,.nav-item.active{background:#252525;color:white}.nav-foot{margin-top:auto;padding:13px 8px;border-top:1px solid #292929;color:#888;font-size:11px}.nav-foot a{display:block;color:#fff;text-decoration:none;margin-top:9px}.content{max-width:1300px;width:100%;margin:auto;padding:30px 36px 55px}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px}.kicker{font:10px monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.top h1{font-size:30px;letter-spacing:-.06em;margin:7px 0 0}.date{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:7px;margin-bottom:19px;flex-wrap:wrap}.tab{border:1px solid var(--line);border-radius:8px;padding:9px 14px;color:var(--muted);text-decoration:none;background:white}.tab.active{background:var(--ink);border-color:var(--ink);color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.stat small{font:10px monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{font-size:27px;font-weight:700;letter-spacing:-.05em;margin-top:12px}.delta{font-size:11px;color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:13px}.panel{margin-bottom:13px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.panel h2{font-size:15px;margin:0}.note{font-size:11px;color:var(--muted)}.chart{height:174px;display:flex;gap:7px;align-items:flex-end;padding:8px 0 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#d2d2cc;border-radius:4px 4px 0 0;min-height:5px;position:relative}.bar:last-child{background:#111}.bar small{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font:9px monospace;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font:10px monospace;text-transform:uppercase;padding:9px 5px;border-bottom:1px solid var(--line)}td{padding:11px 5px;border-bottom:1px solid #eee}.muted{color:var(--muted)}.error{padding:18px;background:white;border:1px solid var(--line);border-radius:10px}.empty{text-align:center;color:var(--muted);padding:24px}.currency{font:10px monospace;color:var(--muted)}@media(max-width:850px){.layout{display:block}.nav{padding:14px;display:block}.brand{padding:0 0 12px}.nav-label,.nav-item,.nav-foot{display:none}.content{padding:22px 14px}.stats{grid-template-columns:repeat(2,1fr)}.grid{display:block}}@media(max-width:460px){.top{display:block}.date{margin-top:12px}.value{font-size:23px}}
</style></head>
<body><div class="layout"><aside class="nav"><div class="brand"><span>e</span>Etriod</div><div class="nav-label">Platform</div><a class="nav-item active" href="#overview" data-section="overview">Overview</a><a class="nav-item" href="#companies" data-section="companies">Companies</a><a class="nav-item" href="#billing" data-section="billing">Billing & usage</a><div class="nav-foot">Platform administrator<a href="app.html">← Back to app</a></div></aside><main class="content"><header class="top"><div><div class="kicker">Platform operations / investor view</div><h1 id="heading">Platform overview</h1></div><div class="date" id="date"></div></header><nav class="tabs"><a class="tab active" href="#overview" data-section="overview">Overview</a><a class="tab" href="#companies" data-section="companies">Companies</a><a class="tab" href="#billing" data-section="billing">Billing & usage</a></nav><div id="content"><div class="panel">Loading secure platform data…</div></div></main></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id),token=localStorage.getItem('etriod_token'),period=x=>x?new Date(x).toLocaleDateString():'—',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token)location.href='login.html';$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
async function api(path){const r=await fetch(window.ETRIOD_API+path,{headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(r.status===401){localStorage.removeItem('etriod_token');location.href='login.html'}if(!r.ok)throw Error(d.error||'Could not load operations data.');return d}
const routes={overview:'/api/admin/overview',companies:'/api/admin/companies',billing:'/api/admin/billing'},titles={overview:'Platform overview',companies:'Company workspaces',billing:'Billing & usage'};
function navigate(section){if(!routes[section])section='overview';history.replaceState(null,'','#'+section);document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===section));$('heading').textContent=titles[section];api(routes[section]).then(d=>({overview:renderOverview,companies:renderCompanies,billing:renderBilling}[section])(d)).catch(e=>$('content').innerHTML='<div class="error">'+esc(e.message)+'<br><small>Administrator access is required.</small></div>')}
document.querySelectorAll('[data-section]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.section)}));window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));function stat(label,value,note=''){return '<div class="stat"><small>'+label+'</small><div class="value">'+esc(value)+'</div><div class="delta">'+note+'</div></div>'}
function renderOverview(d){const t=d.totals,s=d.dailySeries||[],max=Math.max(...s.map(x=>Number(x.count)),1);$('content').innerHTML='<section class="stats">'+stat('Registered users',t.total_users,'All accounts')+stat('New users · 30 days',t.new_users_30d,'Recent acquisition')+stat('Active subscribers',t.active_subscriptions,'Team plan · active or trialing')+stat('Company workspaces',t.total_companies,'Organizations')+stat('Conversations',t.total_conversations,'All time')+stat('Messages',t.total_messages,'All time')+stat('Active people',t.total_active_users,'People with conversations')+stat('Active · 24 hours',t.active_last_24h,'Recent engagement')+'</section><section class="grid"><article class="panel"><div class="panel-head"><h2>Conversation activity</h2><span class="note">Last 14 days</span></div><div class="chart">'+s.map(x=>'<div class="bar" style="height:'+Math.max(6,Number(x.count)/max*140)+'px"><small>'+new Date(x.day).toLocaleDateString(undefined,{weekday:'narrow'})+'</small></div>').join('')+'</div></article><article class="panel"><div class="panel-head"><h2>Recent people</h2><span class="note">By activity</span></div><table><thead><tr><th>Person</th><th>Chats</th></tr></thead><tbody>'+(d.recentUsers||[]).map(u=>'<tr><td>'+esc(u.name)+'<br><span class="muted">'+esc(u.email)+'</span></td><td>'+esc(u.conversation_count)+'</td></tr>').join('')+'</tbody></table></article></section>'}
function renderCompanies(d){const rows=d.companies||[];$('content').innerHTML='<article class="panel"><div class="panel-head"><h2>Company workspaces</h2><span class="note">'+rows.length+' shown · privacy-preserving usage totals</span></div><div style="overflow:auto"><table><thead><tr><th>Company</th><th>Owner</th><th>Members</th><th>Conversations</th><th>Last activity</th><th>Created</th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.owner_email||'—')+'</td><td>'+esc(x.member_count)+'</td><td>'+esc(x.conversation_count)+'</td><td>'+period(x.last_active_at)+'</td><td>'+period(x.created_at)+'</td></tr>').join('')+'</tbody></table></div>'+(rows.length?'':'<div class="empty">No company workspaces yet.</div>')+'</article>'}
function renderBilling(d){const totals=d.providerTotals||[],monthly=d.monthlyRevenue||[],subs=d.subscriptions||[],mrr=d.estimatedMrr||[];$('content').innerHTML='<div class="panel"><div class="panel-head"><h2>Estimated recurring run-rate</h2><span class="note">Latest verified charge per active subscriber; monthly estimate, grouped by currency</span></div><div style="overflow:auto"><table><thead><tr><th>Provider</th><th>Currency</th><th>Active subscribers</th><th>Estimated monthly run-rate</th></tr></thead><tbody>'+mrr.map(x=>'<tr><td>'+esc(x.payment_provider)+'</td><td>'+esc(x.currency)+'</td><td>'+esc(x.subscribers)+'</td><td>'+esc(x.currency)+' '+Number(x.estimated_mrr).toLocaleString()+'</td></tr>').join('')+'</tbody></table>'+(mrr.length?'':'<div class="empty">No verified subscription charges yet; recurring estimates will appear after a payment is captured.</div>')+'</div></div><div class="panel"><div class="panel-head"><h2>Captured payments by provider & currency</h2><span class="note">Gross captured charges before refunds and provider fees; currencies remain separate</span></div><div style="overflow:auto"><table><thead><tr><th>Provider</th><th>Currency</th><th>Paid transactions</th><th>Captured revenue</th><th>Pending orders</th></tr></thead><tbody>'+totals.map(x=>'<tr><td>'+esc(x.payment_provider)+'</td><td class="currency">'+esc(x.currency)+'</td><td>'+esc(x.paid_transactions)+'</td><td>'+esc(x.currency)+' '+Number(x.captured_revenue).toLocaleString()+'</td><td>'+esc(x.pending_orders)+'</td></tr>').join('')+'</tbody></table>'+(totals.length?'':'<div class="empty">No payment orders recorded yet.</div>')+'</div></div><div class="grid"><article class="panel"><div class="panel-head"><h2>Monthly captured revenue</h2><span class="note">Last 6 months · grouped by currency</span></div><div style="overflow:auto"><table><thead><tr><th>Month</th><th>Currency</th><th>Revenue</th><th>Transactions</th></tr></thead><tbody>'+monthly.map(x=>'<tr><td>'+new Date(x.month).toLocaleDateString(undefined,{month:'short',year:'numeric'})+'</td><td>'+esc(x.currency)+'</td><td>'+esc(x.currency)+' '+Number(x.revenue).toLocaleString()+'</td><td>'+esc(x.transactions)+'</td></tr>').join('')+'</tbody></table>'+(monthly.length?'':'<div class="empty">No captured revenue in this period.</div>')+'</div></article><article class="panel"><div class="panel-head"><h2>Subscription status</h2><span class="note">Current records</span></div><table><thead><tr><th>Status</th><th>Subscriptions</th></tr></thead><tbody>'+subs.map(x=>'<tr><td>'+esc(x.status)+'</td><td>'+esc(x.count)+'</td></tr>').join('')+'</tbody></table></article></div>'}
navigate(location.hash.slice(1)||'overview');
</script></body></html>
