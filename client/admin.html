<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etriod — Operations</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--ink:#0b0b0b;--paper:#f6f6f3;--panel:#fff;--line:#deded9;--muted:#777771;--soft:#ededE9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Manrope,Arial,sans-serif}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.nav{background:var(--ink);color:#fff;padding:24px 17px;display:flex;flex-direction:column}.brand{font-weight:800;font-size:20px;letter-spacing:-.05em;padding:0 9px 42px}.brand span{display:inline-grid;place-items:center;background:#fff;color:#000;width:27px;height:27px;border-radius:9px;margin-right:8px;font-family:Georgia}.nav-label{font:10px DM Mono;color:#8b8b86;letter-spacing:.12em;text-transform:uppercase;padding:0 9px 9px}.nav-item{color:#aaa;padding:11px 9px;border-radius:8px;margin:2px 0}.nav-item.active,.nav-item:hover{background:#242424;color:#fff}.nav-foot{margin-top:auto;padding:14px 9px;border-top:1px solid #292929;color:#888;font-size:12px}.nav-foot a{color:#fff;text-decoration:none;display:block;margin-top:9px}.content{max-width:1240px;width:100%;margin:auto;padding:34px 42px 60px}.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:25px}.kicker{font:500 10px DM Mono;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.top h1{font-size:32px;letter-spacing:-.06em;margin:9px 0 0}.date{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.stat .kicker{margin-bottom:13px}.value{font-size:30px;font-weight:700;letter-spacing:-.06em}.delta{font-size:11px;color:var(--muted);margin-top:8px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel h2{font-size:15px;margin:0;letter-spacing:-.03em}.panel-note{font-size:11px;color:var(--muted)}.chart{height:175px;display:flex;gap:10px;align-items:flex-end;padding:12px 2px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#d8d8d2;border-radius:5px 5px 0 0;min-height:8px;position:relative;transition:height .6s ease}.bar:last-child{background:var(--ink)}.bar small{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);color:var(--muted);font:10px DM Mono}.feed{list-style:none;padding:0;margin:0}.feed li{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.feed li:last-child{border:0}.dot{width:7px;height:7px;border-radius:50%;background:var(--ink);margin-top:5px;flex:0 0 7px}.feed small{display:block;color:var(--muted);margin-top:3px;font-size:10px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font:10px DM Mono;text-transform:uppercase;letter-spacing:.06em;padding:9px 6px;border-bottom:1px solid var(--line)}td{padding:13px 6px;border-bottom:1px solid #f0f0ed}td:last-child{color:var(--muted)}.error{color:#555;padding:18px;background:#eee;border-radius:9px}@media(max-width:850px){.layout{display:block}.nav{height:auto;padding:15px;display:block}.brand{padding:0 0 15px}.nav-label,.nav-item,.nav-foot{display:none}.content{padding:25px 16px}.stats{grid-template-columns:repeat(2,1fr)}.grid{display:block}}@media(max-width:480px){.top{display:block}.date{margin-top:15px}.value{font-size:25px}}
</style>
</head>
<body><div class="layout"><aside class="nav"><div class="brand"><span>e</span>Etriod</div><div class="nav-label">Operations</div><div class="nav-item active">Overview</div><div class="nav-item">People & access</div><div class="nav-item">Agent health</div><div class="nav-item">Billing</div><div class="nav-foot">Internal workspace<a href="app.html">← Back to app</a></div></aside><main class="content"><div class="top"><div><div class="kicker">Operations console / 01</div><h1>Good morning, team.</h1></div><div class="date" id="date"></div></div><div id="content"><div class="panel">Loading workspace telemetry…</div></div></main></div>
<script src="config.js"></script><script>
const token=localStorage.getItem('etriod_token');if(!token)location.href='login.html';$('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function $(id){return document.getElementById(id)}function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
fetch(window.ETRIOD_API+'/api/admin/overview',{headers:{Authorization:'Bearer '+token}}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load operations data.');render(d)}).catch(e=>{$('content').innerHTML='<div class="error">'+esc(e.message)+'<br><small>Admin access is restricted to accounts with the admin role.</small></div>'});
function render(d){const t=d.totals,series=d.dailySeries||[],max=Math.max(...series.map(x=>Number(x.count)),1);$('content').innerHTML='<div class="stats"><div class="stat"><div class="kicker">Conversations</div><div class="value">'+t.total_conversations+'</div><div class="delta">All time</div></div><div class="stat"><div class="kicker">Messages</div><div class="value">'+t.total_messages+'</div><div class="delta">Across every workspace</div></div><div class="stat"><div class="kicker">Active people</div><div class="value">'+t.total_active_users+'</div><div class="delta">With a conversation</div></div><div class="stat"><div class="kicker">Last 24 hours</div><div class="value">'+t.active_last_24h+'</div><div class="delta">Currently engaged</div></div></div><div class="grid"><div class="panel"><div class="panel-head"><h2>Conversation activity</h2><span class="panel-note">Last 14 days</span></div><div class="chart">'+series.map(x=>'<div class="bar" style="height:'+Math.max(8,Number(x.count)/max*145)+'px"><small>'+new Date(x.day).toLocaleDateString(undefined,{weekday:'narrow'})+'</small></div>').join('')+'</div></div><div class="panel"><div class="panel-head"><h2>System pulse</h2><span class="panel-note">Live</span></div><ul class="feed"><li><span class="dot"></span><div>AI responses are streaming normally<small>Anthropic connection healthy</small></div></li><li><span class="dot"></span><div>Workspace access is protected<small>Role-based admin controls enabled</small></div></li><li><span class="dot"></span><div>Conversation history is available<small>Persistence layer connected</small></div></li></ul></div></div><div class="panel"><div class="panel-head"><h2>Recent people</h2><span class="panel-note">Latest activity</span></div><table><thead><tr><th>Person</th><th>Email</th><th>Conversations</th><th>Last active</th></tr></thead><tbody>'+(d.recentUsers||[]).map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+u.conversation_count+'</td><td>'+new Date(u.last_active_at).toLocaleString()+'</td></tr>').join('')+'</tbody></table></div>'}
</script></body></html>
